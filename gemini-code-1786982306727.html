<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直線の双極と円環宇宙論 | Cosmic Creation</title>
  <style>
    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background-color: #000;
      color: #e0e6ed;
      font-family: serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    
    #nav-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1rem;
      background: rgba(22, 27, 34, 0.9);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      border: 1px solid #30363d;
      font-family: sans-serif;
      z-index: 10;
    }
    .nav-btn {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #30363d;
      color: #79c0ff;
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #step-select {
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #story-container {
      text-align: center;
      max-width: 700px;
      width: 100%;
      margin-bottom: 1.5rem;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .concept-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }
    .concept-body {
      text-align: left;
      font-size: 0.95rem;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.2rem;
      font-family: sans-serif;
    }
    canvas {
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    .controls-container {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      background: rgba(22, 27, 34, 0.8);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid #30363d;
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #c9d1d9;
    }
    .controls-container input[type=range] {
      cursor: pointer;
      accent-color: #58a6ff;
    }
    .hint {
      margin-top: 0.8rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      color: #8b949e;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="nav-controls">
    <button class="nav-btn" id="prevBtn">← 戻る</button>
    <select id="step-select"></select>
    <button class="nav-btn" id="nextBtn">次へ →</button>
  </div>

  <div id="story-container">
    <div id="step-0-text">
      何もない。<br>
      境界もない。
    </div>
  </div>

  <canvas id="cosmoCanvas" width="500" height="400"></canvas>
  
  <div class="controls-container" id="controls" style="display: none;">
    <label for="speedSlider">運動速度:</label>
    <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1.5">
    <span id="speedValue">1.5x</span>

    <div id="z-control" style="display: none; margin-left: 1rem;">
      <label for="zRotSlider">Z軸回転:</label>
      <input type="range" id="zRotSlider" min="0" max="360" step="1" value="0">
      <span id="zRotValue">0°</span>
    </div>
  </div>

  <div class="hint">「← 戻る / 次へ →」ボタン、ドロップダウン、またはキーボード（← / →）で操作</div>

  <script>
    const canvas = document.getElementById('cosmoCanvas');
    const ctx = canvas.getContext('2d');
    const storyContainer = document.getElementById('story-container');
    const controls = document.getElementById('controls');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const zControl = document.getElementById('z-control');
    const zRotSlider = document.getElementById('zRotSlider');
    const zRotValue = document.getElementById('zRotValue');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stepSelect = document.getElementById('step-select');

    let step = 0;
    const maxStep = 29;
    let speedFactor = 1.5;
    let zRotationAngle = 0;

    const stepTitles = [
      "Step 0: 完全なる無",
      "Step 1: 双極の場の分断",
      "Step 2: 直線の双極と円環宇宙論",
      "Step 3: 宇宙の始まり（双極OO）",
      "Step 4: 線分の確立",
      "Step 5: 直交極（＋O2, ＋O3）",
      "Step 6: 負の直交双極",
      "Step 7: 直線「ー」の伸張",
      "Step 8: 軸拘束と O1 の引き合い",
      "Step 9: O2 の押され引かれる円運動",
      "Step 10: O3 の周回連動",
      "Step 11: O1 の ーー 上単振動",
      "Step 12: －O2 回転中心の決定",
      "Step 13: ーー 自体の中心回転",
      "Step 14: 3次元自由回転",
      "Step 15: 軌道塗りつぶし（双極球体）",
      "Step 16: 第一世代の誕生（XYZ軸/Z回転付き）",
      "Step 17: 第一世代の内部構造",
      "Step 18: 6本線と指先結合",
      "Step 19: 接点0（実体なし）",
      "Step 20: 接点消滅と－OOπO / ＋OOπO",
      "Step 21: 光速の壁の破壊とエネルギーなきOOπO",
      "Step 22: 6つのOOπOと新たな接点の創成",
      "Step 23: 光速励起と18のOOπO（第3世代）",
      "Step 24: 3x3x3の27正方形グリッド壁による拘束",
      "Step 25: 第4世代（4x4x4マスの中に54個）",
      "Step 26: 第5世代（1マス1辺＝OOπO直径）",
      "Step 27: 動（生）と止（死）の力学平衡",
      "Step 28: 225要素の粒子創成 (3x3x5x5調和)",
      "Step 29: 37の質量変換と225要素空間の完結"
    ];

    stepTitles.forEach((title, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = title;
      stepSelect.appendChild(opt);
    });

    speedSlider.addEventListener('input', (e) => {
      speedFactor = parseFloat(e.target.value);
      speedValue.textContent = speedFactor.toFixed(1) + 'x';
    });

    zRotSlider.addEventListener('input', (e) => {
      const deg = parseInt(e.target.value, 10);
      zRotationAngle = (deg * Math.PI) / 180;
      zRotValue.textContent = deg + '°';
    });

    let shmPhase = 0;
    let rotAngleO2 = 0;
    let rotAngleO3 = 0;
    let axisRotAngle = 0;
    let tiltAngle1 = 0;
    let tiltAngle2 = 0;
    let bipyramidRot = 0;
    let breakEffectPhase = 0;
    let animId = null;

    function changeStep(newStep) {
      if (newStep < 0 || newStep > maxStep) return;
      step = newStep;
      stepSelect.value = step;
      prevBtn.disabled = (step === 0);
      nextBtn.disabled = (step === maxStep);

      updateText();
      if (animId) cancelAnimationFrame(animId);
      draw();
    }

    prevBtn.addEventListener('click', () => changeStep(step - 1));
    nextBtn.addEventListener('click', () => changeStep(step + 1));
    stepSelect.addEventListener('change', (e) => changeStep(parseInt(e.target.value, 10)));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeStep(step - 1);
      if (e.key === 'ArrowRight') changeStep(step + 1);
    });

    function drawFirstGenSphere(cX, cY, r, isRight) {
      const grad = ctx.createRadialGradient(cX, cY, 2, cX, cY, r);
      if (isRight) {
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        grad.addColorStop(0.4, 'rgba(88, 166, 255, 0.6)');
        grad.addColorStop(0.8, 'rgba(188, 140, 255, 0.3)');
        grad.addColorStop(1, 'rgba(88, 166, 255, 0)');
      } else {
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        grad.addColorStop(0.4, 'rgba(240, 136, 62, 0.6)');
        grad.addColorStop(0.8, 'rgba(244, 112, 103, 0.3)');
        grad.addColorStop(1, 'rgba(240, 136, 62, 0)');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cX, cY, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cX, cY, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    function draw() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      if (step === 15) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (step >= 8 && step < 16) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      if (step === 0) {
        // 完全なる無
      } 
      else if (step === 1) {
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, centerX, canvas.height);
        ctx.fillStyle = '#11161d'; ctx.fillRect(centerX, 0, centerX, canvas.height);
        ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX - 80, 160, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.beginPath(); ctx.arc(centerX + 80, 160, 4, 0, Math.PI * 2); ctx.fillStyle = '#f0883e'; ctx.fill();
      }
      else if (step === 2) {
        const circleCenterY = 160; const radius = 100; const lineY = 320;
        ctx.beginPath(); ctx.arc(centerX, circleCenterY, radius, 0, Math.PI * 2); ctx.strokeStyle = '#1f6beb'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX + radius, circleCenterY, 6, 0, Math.PI * 2); ctx.fillStyle = '#58a6ff'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(centerX - radius, lineY); ctx.lineTo(centerX + radius, lineY); ctx.strokeStyle = '#30363d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f85149'; ctx.beginPath(); ctx.arc(centerX - radius, lineY, 5, 0, Math.PI * 2); ctx.arc(centerX + radius, lineY, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(centerX + radius, lineY, 6, 0, Math.PI * 2); ctx.fillStyle = '#f0883e'; ctx.fill();
      }
      else if (step === 3) {
        ctx.beginPath(); ctx.moveTo(centerX, 50); ctx.lineTo(centerX, 350); ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(centerX, 150); ctx.lineTo(centerX - 120, 150); ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - 60, 150, 6, 0, Math.PI * 2); ctx.arc(centerX - 120, 150, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(centerX, 250); ctx.lineTo(centerX + 120, 250); ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + 60, 250, 6, 0, Math.PI * 2); ctx.arc(centerX + 120, 250, 6, 0, Math.PI * 2); ctx.fill();
      }
      else if (step === 4) {
        const dist = 120;
        ctx.beginPath(); ctx.moveTo(centerX - dist, centerY); ctx.lineTo(centerX + dist, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#8b949e'; ctx.font = '14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 20);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 15, centerY - 15);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist - 10, centerY - 15);
      }
      else if (step === 5) {
        const dist = 110; const diagDist = dist * 0.75;
        ctx.beginPath(); ctx.moveTo(centerX - dist, centerY); ctx.lineTo(centerX + dist, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX, centerY - dist); ctx.lineTo(centerX, centerY + dist); ctx.strokeStyle = '#38d430'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX - diagDist, centerY + diagDist); ctx.lineTo(centerX + diagDist, centerY - diagDist); ctx.strokeStyle = '#bc8cff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#8b949e'; ctx.font = '12px sans-serif'; ctx.fillText('0', centerX + 8, centerY + 15);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 25, centerY + 4);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist + 10, centerY + 4);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(centerX, centerY - dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O2', centerX - 12, centerY - dist - 12);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(centerX + diagDist, centerY - diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O3', centerX + diagDist + 10, centerY - diagDist - 6);
      }
      else if (step === 6) {
        const dist = 110; const diagDist = dist * 0.75;
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 5);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist + 10, centerY + 5);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(centerX, centerY - dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O2', centerX - 12, centerY - dist - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(centerX + diagDist, centerY - diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O3', centerX + diagDist + 10, centerY - diagDist - 5);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 35, centerY + 5);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(centerX, centerY + dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O2', centerX - 12, centerY + dist + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(centerX - diagDist, centerY + diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O3', centerX - diagDist - 35, centerY + diagDist + 10);
      }
      else if (step === 7) {
        const baseDist = 100; const extLength = 190;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p1 = { x: centerX + baseDist, y: centerY };
        const p2 = { x: centerX, y: centerY - 90 };
        const p3 = { x: centerX + 65, y: centerY - 65 };
        const m1 = { x: centerX - baseDist, y: centerY };
        const m2 = { x: centerX, y: centerY + 90 };
        const m3 = { x: centerX - 65, y: centerY + 65 };

        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1.x, p1.y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1 (親指)', p1.x - 15, p1.y - 12);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2 (人指)', p2.x - 20, p2.y - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3 (中指)', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1.x, m1.y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1 (親指)', m1.x - 25, m1.y - 12);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2.x, m2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2 (人指)', m2.x - 20, m2.y + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3 (中指)', m3.x - 75, m3.y + 15);
      }
      else if (step === 8) {
        const baseDist = 120; const extLength = 190; const gap = 8;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p2 = { x: centerX, y: centerY - 90 }; const p3 = { x: centerX + 65, y: centerY - 65 };
        const m2 = { x: centerX, y: centerY + 90 }; const m3 = { x: centerX - 65, y: centerY + 65 };

        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2', p2.x - 12, p2.y - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2.x, m2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2', m2.x - 12, m2.y + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3.x - 75, m3.y + 15);

        const attraction = (Math.sin(shmPhase) + 1) * 0.5;
        const currentDist = baseDist - (baseDist - 25) * attraction;
        const p1X = centerX + currentDist; const m1X = centerX - currentDist;

        ctx.beginPath(); ctx.moveTo(m1X, centerY); ctx.lineTo(p1X, centerY); ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1', p1X - 10, centerY - 12);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1', m1X - 15, centerY - 12);

        shmPhase += 0.03 * speedFactor;
        animId = requestAnimationFrame(draw);
      }
      else if (step === 9) {
        const baseDist = 120; const extLength = 190; const gap = 8;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p1X = centerX + baseDist * 0.8;
        const m1X = centerX - baseDist * 0.8;

        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1 (中心)', p1X - 15, centerY + 20);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1 (中心)', m1X - 25, centerY + 20);

        const p3 = { x: centerX + 65, y: centerY - 65 }; const m3 = { x: centerX - 65, y: centerY + 65 };
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3.x - 75, m3.y + 15);

        const o2Radius = 60;

        ctx.beginPath(); ctx.arc(p1X, centerY, o2Radius, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(56, 212, 48, 0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.stroke();
        ctx.beginPath(); ctx.arc(m1X, centerY, o2Radius, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(210, 153, 34, 0.3)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);

        const o2X = p1X + o2Radius * Math.cos(rotAngleO2);
        const o2Y = centerY - o2Radius * Math.sin(rotAngleO2);

          const grad = ctx.createRadialGradient(ox, oy, 1, ox, oy, childR * 0.8);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.5, '#f0883e');
          grad.addColorStop(1, 'rgba(240, 136, 62, 0.1)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(ox, oy, childR * 0.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(ox, oy, childR * 0.8, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('125個の止(固定・拘束・死) ＋ [125 OπO ＋ 37 OOπO] の動(生・存在)', centerX - 160, centerY + halfSize + 25);

        animId = requestAnimationFrame(draw);
      }
      else if (step === 28) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        shmPhase += 0.05 * speedFactor;
        bipyramidRot += 0.02 * speedFactor;

        const mainParticleR = 120;

        const particleGrad = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, mainParticleR);
        particleGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        particleGrad.addColorStop(0.3, 'rgba(88, 166, 255, 0.7)');
        particleGrad.addColorStop(0.7, 'rgba(188, 140, 255, 0.4)');
        particleGrad.addColorStop(1, 'rgba(240, 136, 62, 0.15)');

        ctx.fillStyle = particleGrad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, mainParticleR, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, mainParticleR, 0, Math.PI * 2);
        ctx.stroke();

        const subElemCount = 37;
        const innerOrbitR = mainParticleR * 0.65;

        for (let i = 0; i < subElemCount; i++) {
          const ang = bipyramidRot + (i * Math.PI * 2) / subElemCount;
          const px = centerX + innerOrbitR * Math.cos(ang);
          const py = centerY + innerOrbitR * 0.6 * Math.sin(ang);

          ctx.fillStyle = '#f0883e';
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(88, 166, 255, 0.35)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(centerX, centerY);
          ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('225要素粒子 (187のO ＋ 38のπ) ＝ 3x3x5x5', centerX - 130, centerY + mainParticleR + 25);

        animId = requestAnimationFrame(draw);
      }
      else if (step === 29) {
        // Step 29: 37の質量変換と225要素空間の完結
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        shmPhase += 0.05 * speedFactor;
        bipyramidRot += 0.02 * speedFactor;

        const outerParticleR = 135;

        // 1. 125のOが融合した質量凝縮場 (中心π不在)
        const massGrad = ctx.createRadialGradient(centerX, centerY, 25, centerX, centerY, outerParticleR);
        massGrad.addColorStop(0, 'rgba(0, 0, 0, 0.95)'); // 中心はπ不存在のため「ブラックホール/空洞」状態
        massGrad.addColorStop(0.3, 'rgba(255, 215, 0, 0.6)'); // 質量エネルギー境界
        massGrad.addColorStop(0.7, 'rgba(88, 166, 255, 0.4)');
        massGrad.addColorStop(1, 'rgba(240, 136, 62, 0.1)');

        ctx.fillStyle = massGrad;
        ctx.beginPath();
        ctx.arc(centerX, centerY, outerParticleR, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, outerParticleR, 0, Math.PI * 2);
        ctx.stroke();

        // 2. 36個の OOπO (周回軌道) ＋ 1個の OOπO (中心コア) ＝ 37個の流動系
        const orbCount = 36;
        const orbR = outerParticleR * 0.7;

        for (let i = 0; i < orbCount; i++) {
          const ang = bipyramidRot + (i * Math.PI * 2) / orbCount;
          const px = centerX + orbR * Math.cos(ang);
          const py = centerY + orbR * 0.55 * Math.sin(ang);

          ctx.fillStyle = '#58a6ff';
          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fill();

          // 軌道上の π (中心には入らない)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(px, py, 7, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 3. 中心に配される 1つの中心 O (πは中心に存在不可)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('37(1+36)の質量変換 ｜ 162x4=648 / 486のO＋162のπ', centerX - 150, centerY + outerParticleR + 25);

        animId = requestAnimationFrame(draw);
      }
    }
