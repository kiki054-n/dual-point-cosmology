<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直線の双極と円環宇宙論 | Cosmic Creation</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      background-color: #000;
      color: #e0e6ed;
      font-family: serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
      box-sizing: border-box;
    }
    #story-container {
      text-align: center;
      max-width: 700px;
      width: 100%;
      margin-bottom: 2rem;
      line-height: 1.8;
      letter-spacing: 0.05em;
    }
    .concept-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }
    .concept-body {
      text-align: left;
      font-size: 0.95rem;
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.5rem;
      font-family: sans-serif;
    }
    canvas {
      cursor: pointer;
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }
    .controls-container {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(22, 27, 34, 0.8);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      border: 1px solid #30363d;
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #c9d1d9;
    }
    .controls-container input[type=range] {
      cursor: pointer;
      accent-color: #58a6ff;
    }
    .hint {
      margin-top: 1rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: #8b949e;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <div id="story-container">
    <div id="step-0-text">
      何もない。<br>
      境界もない。
    </div>
  </div>

  <canvas id="cosmoCanvas" width="500" height="400"></canvas>
  
  <div class="controls-container" id="controls" style="display: none;">
    <label for="speedSlider">運動速度:</label>
    <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1">
    <span id="speedValue">1.0x</span>
  </div>

  <div class="hint">画面（またはキャンバス）をクリックして次のステップへ進む</div>

  <script>
    const canvas = document.getElementById('cosmoCanvas');
    const ctx = canvas.getContext('2d');
    const storyContainer = document.getElementById('story-container');
    const controls = document.getElementById('controls');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    let step = 0;
    let speedFactor = 1.0;

    speedSlider.addEventListener('input', (e) => {
      speedFactor = parseFloat(e.target.value);
      speedValue.textContent = speedFactor.toFixed(1) + 'x';
    });

    let shmPhase = 0;
    let rotAngleO2 = 0;
    let rotAngleO3 = 0;
    let axisRotAngle = 0;
    let tiltAngle1 = 0;
    let tiltAngle2 = 0;
    let animId = null;

    function draw() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // 段階 15: 軌跡を塗りつぶして球を可視化するため背景消去を極極薄（0.03）に設定
      if (step === 15) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (step >= 8) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      if (step === 0) {
        // 段階 0: 完全なる無
      } 
      else if (step === 1) {
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, centerX, canvas.height);
        ctx.fillStyle = '#11161d'; ctx.fillRect(centerX, 0, centerX, canvas.height);
        ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX - 80, 160, 4, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.beginPath(); ctx.arc(centerX + 80, 160, 4, 0, Math.PI * 2); ctx.fillStyle = '#f0883e'; ctx.fill();
      }
      else if (step === 2) {
        const circleCenterY = 160; const radius = 100; const lineY = 320;
        ctx.beginPath(); ctx.arc(centerX, circleCenterY, radius, 0, Math.PI * 2); ctx.strokeStyle = '#1f6beb'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX + radius, circleCenterY, 6, 0, Math.PI * 2); ctx.fillStyle = '#58a6ff'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(centerX - radius, lineY); ctx.lineTo(centerX + radius, lineY); ctx.strokeStyle = '#30363d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f85149'; ctx.beginPath(); ctx.arc(centerX - radius, lineY, 5, 0, Math.PI * 2); ctx.arc(centerX + radius, lineY, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(centerX + radius, lineY, 6, 0, Math.PI * 2); ctx.fillStyle = '#f0883e'; ctx.fill();
      }
      else if (step === 3) {
        ctx.beginPath(); ctx.moveTo(centerX, 50); ctx.lineTo(centerX, 350); ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(centerX, 150); ctx.lineTo(centerX - 120, 150); ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - 60, 150, 6, 0, Math.PI * 2); ctx.arc(centerX - 120, 150, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(centerX, 250); ctx.lineTo(centerX + 120, 250); ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + 60, 250, 6, 0, Math.PI * 2); ctx.arc(centerX + 120, 250, 6, 0, Math.PI * 2); ctx.fill();
      }
      else if (step === 4) {
        const dist = 120;
        ctx.beginPath(); ctx.moveTo(centerX - dist, centerY); ctx.lineTo(centerX + dist, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#8b949e'; ctx.font = '14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 20);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 15, centerY - 15);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist - 10, centerY - 15);
      }
      else if (step === 5) {
        const dist = 110; const diagDist = dist * 0.75;
        ctx.beginPath(); ctx.moveTo(centerX - dist, centerY); ctx.lineTo(centerX + dist, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX, centerY - dist); ctx.lineTo(centerX, centerY + dist); ctx.strokeStyle = '#38d430'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX - diagDist, centerY + diagDist); ctx.lineTo(centerX + diagDist, centerY - diagDist); ctx.strokeStyle = '#bc8cff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#8b949e'; ctx.font = '12px sans-serif'; ctx.fillText('0', centerX + 8, centerY + 15);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 25, centerY + 4);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist + 10, centerY + 4);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(centerX, centerY - dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O2', centerX - 12, centerY - dist - 12);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(centerX + diagDist, centerY - diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O3', centerX + diagDist + 10, centerY - diagDist - 6);
      }
      else if (step === 6) {
        const dist = 110; const diagDist = dist * 0.75;
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 5);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(centerX + dist, centerY, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O1', centerX + dist + 10, centerY + 5);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(centerX, centerY - dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O2', centerX - 12, centerY - dist - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(centerX + diagDist, centerY - diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('+O3', centerX + diagDist + 10, centerY - diagDist - 5);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(centerX - dist, centerY, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O1', centerX - dist - 35, centerY + 5);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(centerX, centerY + dist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O2', centerX - 12, centerY + dist + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(centerX - diagDist, centerY + diagDist, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillText('-O3', centerX - diagDist - 35, centerY + diagDist + 10);
      }
      else if (step === 7) {
        const baseDist = 100; const extLength = 190;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(centerX, centerY, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p1 = { x: centerX + baseDist, y: centerY };
        const p2 = { x: centerX, y: centerY - 90 };
        const p3 = { x: centerX + 65, y: centerY - 65 };
        const m1 = { x: centerX - baseDist, y: centerY };
        const m2 = { x: centerX, y: centerY + 90 };
        const m3 = { x: centerX - 65, y: centerY + 65 };

        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1.x, p1.y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1 (親指)', p1.x - 15, p1.y - 12);
        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2 (人指)', p2.x - 20, p2.y - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3 (中指)', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1.x, m1.y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1 (親指)', m1.x - 25, m1.y - 12);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2.x, m2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2 (人指)', m2.x - 20, m2.y + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3 (中指)', m3.x - 75, m3.y + 15);
      }
      else if (step === 8) {
        const baseDist = 120; const extLength = 190; const gap = 8;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p2 = { x: centerX, y: centerY - 90 }; const p3 = { x: centerX + 65, y: centerY - 65 };
        const m2 = { x: centerX, y: centerY + 90 }; const m3 = { x: centerX - 65, y: centerY + 65 };

        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2', p2.x - 12, p2.y - 10);
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2.x, m2.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2', m2.x - 12, m2.y + 20);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3.x - 75, m3.y + 15);

        const attraction = (Math.sin(shmPhase) + 1) * 0.5;
        const currentDist = baseDist - (baseDist - 25) * attraction;
        const p1X = centerX + currentDist; const m1X = centerX - currentDist;

        ctx.beginPath(); ctx.moveTo(m1X, centerY); ctx.lineTo(p1X, centerY); ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1', p1X - 10, centerY - 12);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1', m1X - 15, centerY - 12);

        shmPhase += 0.03 * speedFactor;
        animId = requestAnimationFrame(draw);
      }
      else if (step === 9) {
        const baseDist = 120; const extLength = 190; const gap = 8;
        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p1X = centerX + baseDist * 0.8; const m1X = centerX - baseDist * 0.8;
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1', p1X - 10, centerY - 12);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1', m1X - 15, centerY - 12);

        const p3 = { x: centerX + 65, y: centerY - 65 }; const m3 = { x: centerX - 65, y: centerY + 65 };
        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(p3.x, p3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', p3.x + 10, p3.y - 5);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3.x, m3.y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3.x - 75, m3.y + 15);

        const o2Radius = 80;
        ctx.beginPath(); ctx.ellipse(centerX, centerY, o2Radius * 0.4, o2Radius, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(56, 212, 48, 0.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

        const o2X = centerX + o2Radius * 0.4 * Math.cos(rotAngleO2);
        const o2Y = centerY - o2Radius * Math.sin(rotAngleO2);
        const m2X = centerX - o2Radius * 0.4 * Math.cos(rotAngleO2);
        const m2Y = centerY + o2Radius * Math.sin(rotAngleO2);

        ctx.beginPath(); ctx.moveTo(m1X, centerY); ctx.lineTo(o2X, o2Y); ctx.strokeStyle = 'rgba(240, 136, 62, 0.4)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(o2X, o2Y); ctx.lineTo(p1X, centerY); ctx.strokeStyle = 'rgba(88, 166, 255, 0.4)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(o2X, o2Y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2', o2X + 10, o2Y + 4);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2X, m2Y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2', m2X - 30, m2Y + 4);

        rotAngleO2 += 0.03 * speedFactor;
        animId = requestAnimationFrame(draw);
      }
      else if (step === 10) {
        const baseDist = 120; const extLength = 190; const gap = 8;

        ctx.beginPath(); ctx.moveTo(centerX - extLength, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + extLength, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - extLength - 20, centerY + 5); ctx.fillText('ー', centerX + extLength + 10, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const p1X = centerX + baseDist * 0.8; const m1X = centerX - baseDist * 0.8;
        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1', p1X - 10, centerY - 12);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1', m1X - 15, centerY - 12);

        const o2Radius = 80;
        ctx.beginPath(); ctx.ellipse(centerX, centerY, o2Radius * 0.4, o2Radius, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(56, 212, 48, 0.2)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke();
        const o2X = centerX + o2Radius * 0.4 * Math.cos(rotAngleO2);
        const o2Y = centerY - o2Radius * Math.sin(rotAngleO2);
        const m2X = centerX - o2Radius * 0.4 * Math.cos(rotAngleO2);
        const m2Y = centerY + o2Radius * Math.sin(rotAngleO2);

        ctx.fillStyle = '#38d430'; ctx.beginPath(); ctx.arc(o2X, o2Y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O2', o2X + 8, o2Y + 4);
        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2X, m2Y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2', m2X - 25, m2Y + 4);

        const o3Radius = 90;
        ctx.beginPath(); ctx.ellipse(centerX, centerY, o3Radius, o3Radius * 0.45, -Math.PI / 4, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(188, 140, 255, 0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

        const cos3 = Math.cos(rotAngleO3); const sin3 = Math.sin(rotAngleO3);
        const rx = o3Radius * cos3; const ry = o3Radius * 0.45 * sin3;
        const cos45 = Math.cos(-Math.PI / 4); const sin45 = Math.sin(-Math.PI / 4);

        const o3X = centerX + (rx * cos45 - ry * sin45);
        const o3Y = centerY + (rx * sin45 + ry * cos45);
        const m3X = centerX - (rx * cos45 - ry * sin45);
        const m3Y = centerY - (rx * sin45 + ry * cos45);

        ctx.beginPath(); ctx.moveTo(m1X, centerY); ctx.lineTo(o3X, o3Y); ctx.strokeStyle = 'rgba(240, 136, 62, 0.3)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p1X, centerY); ctx.lineTo(o3X, o3Y); ctx.strokeStyle = 'rgba(88, 166, 255, 0.3)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(o3X, o3Y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', o3X + 10, o3Y - 5);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3X, m3Y, 7, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3X - 35, m3Y + 15);

        rotAngleO2 += 0.025 * speedFactor;
        rotAngleO3 += 0.035 * speedFactor;
        animId = requestAnimationFrame(draw);
      }
      else if (step === 11) {
        const minOffset = 25; const maxOffset = 160; const gap = 8;

        ctx.beginPath(); ctx.moveTo(centerX - maxOffset - 30, centerY); ctx.lineTo(centerX - gap, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(centerX + gap, centerY); ctx.lineTo(centerX + maxOffset + 30, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', centerX - maxOffset - 50, centerY + 5); ctx.fillText('ー', centerX + maxOffset + 40, centerY + 5);
        ctx.fillStyle = '#8b949e'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('0', centerX - 4, centerY + 22);

        const amplitude = (maxOffset - minOffset) / 2;
        const centerPos = (maxOffset + minOffset) / 2;
        const currentPos = centerPos + amplitude * Math.cos(shmPhase);

        const p1X = centerX + currentPos; const m1X = centerX - currentPos;

        ctx.fillStyle = '#58a6ff'; ctx.beginPath(); ctx.arc(p1X, centerY, 8, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O1', p1X - 12, centerY - 15);
        ctx.fillStyle = '#f0883e'; ctx.beginPath(); ctx.arc(m1X, centerY, 8, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O1', m1X - 15, centerY - 15);

        ctx.beginPath(); ctx.moveTo(m1X, centerY); ctx.lineTo(p1X, centerY); ctx.strokeStyle = 'rgba(88, 166, 255, 0.4)'; ctx.lineWidth = 2; ctx.stroke();

        const o2Radius = 75;

        ctx.fillStyle = '#d29922'; ctx.beginPath(); ctx.arc(m2X, m2Y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O2', m2X - 25, m2Y + 4);

        const o3Radius = 85;
        const cos3 = Math.cos(rotAngleO3); const sin3 = Math.sin(rotAngleO3);
        const rx = o3Radius * cos3; const ry = o3Radius * 0.45 * sin3;

        ctx.fillStyle = '#bc8cff'; ctx.beginPath(); ctx.arc(o3X, o3Y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('+O3', o3X + 10, o3Y - 5);
        ctx.fillStyle = '#f47067'; ctx.beginPath(); ctx.arc(m3X, m3Y, 6, 0, Math.PI*2); ctx.fill(); ctx.fillText('-O3', m3X - 35, m3Y + 15);

        ctx.beginPath(); ctx.moveTo(p1X, centerY); ctx.lineTo(o2X, o2Y); ctx.strokeStyle = 'rgba(88, 166, 255, 0.25)'; ctx.lineWidth = 1; ctx.stroke();

        shmPhase += 0.035 * speedFactor; rotAngleO2 += 0.025 * speedFactor; rotAngleO3 += 0.035 * speedFactor;
        animId = requestAnimationFrame(draw);
      }
      else if (step === 12) {
        const gap = 10;
        const outerLimit = 180;

        const pX1 = centerX + outerLimit;
        const px_minus1 = centerX + gap;
        const mX1 = centerX - outerLimit;

        ctx.beginPath(); ctx.moveTo(px_minus1, centerY); ctx.lineTo(pX1, centerY); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('ー', mX1 - 20, centerY + 5); ctx.fillText('ー', pX1 + 10, centerY + 5);

        ctx.beginPath(); ctx.ellipse(pCenter, centerY, rotRadius, rotRadius * Math.abs(scaleY1), axisRotAngle, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(56, 212, 48, 0.3)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.stroke();
